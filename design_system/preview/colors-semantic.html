<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body { padding: 20px; background: white; }
.row { display: flex; gap: 8px; margin-bottom: 8px; }
.swatch { flex: 1; padding: 12px; border-radius: 10px; }
.name { font-size: 11px; font-weight: 700; }
.hex { font-family: var(--rh-font-mono); font-size: 10px; opacity: 0.75; }
</style></head><body>
<div class="row">
  <div class="swatch" style="background: var(--rh-teal-100); color: var(--rh-teal-700);"><div class="name">Success tint</div><div class="hex">#E4F5EE</div></div>
  <div class="swatch" style="background: var(--rh-blue-100); color: var(--rh-blue-700);"><div class="name">Blue tint</div><div class="hex">#E8F0FA</div></div>
  <div class="swatch" style="background: var(--rh-warning-100); color: var(--rh-warning);"><div class="name">Warning tint</div><div class="hex">#FEF3E0</div></div>
  <div class="swatch" style="background: var(--rh-danger-100); color: var(--rh-danger);"><div class="name">Danger tint</div><div class="hex">#FCEBEB</div></div>
</div>
<div class="row">
  <div class="swatch" style="background: var(--rh-teal); color: white;"><div class="name">Success</div><div class="hex">#1D9E75</div></div>
  <div class="swatch" style="background: var(--rh-blue); color: white;"><div class="name">Info</div><div class="hex">#185FA5</div></div>
  <div class="swatch" style="background: var(--rh-warning); color: white;"><div class="name">Warning</div><div class="hex">#D97706</div></div>
  <div class="swatch" style="background: var(--rh-danger); color: white;"><div class="name">Danger</div><div class="hex">#DC2626</div></div>
</div>
</body></html>
