<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../colors_and_type.css"/><style>body{padding:24px;background:#F7F9FC;}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}.box{background:white;border-radius:12px;height:90px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--rh-fg-2);font-weight:600;}</style></head><body>
<div class="row">
  <div class="box" style="box-shadow:0 1px 2px rgba(4,44,83,0.04);">xs</div>
  <div class="box" style="box-shadow:0 1px 3px rgba(4,44,83,0.06),0 1px 2px rgba(4,44,83,0.04);">sm</div>
  <div class="box" style="box-shadow:0 4px 12px rgba(4,44,83,0.08);">md</div>
  <div class="box" style="box-shadow:0 12px 32px rgba(4,44,83,0.12);">lg</div>
</div>
</body></html>
