<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../colors_and_type.css"/><style>body{padding:24px;background:white;}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}.sw{border-radius:12px;padding:16px;height:100px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--rh-border);}.sw .name{font-size:13px;font-weight:700;}.sw .hex{font-family:var(--rh-font-mono);font-size:11px;opacity:0.85;}</style></head><body>
<div class="row">
  <div class="sw" style="background:#042C53;color:white;border-color:transparent;"><div class="name">Navy / Primary</div><div class="hex">#042C53 · --rh-navy</div></div>
  <div class="sw" style="background:#185FA5;color:white;border-color:transparent;"><div class="name">Blue / Accent</div><div class="hex">#185FA5 · --rh-blue</div></div>
  <div class="sw" style="background:#1D9E75;color:white;border-color:transparent;"><div class="name">Teal / Verified</div><div class="hex">#1D9E75 · --rh-teal</div></div>
</div>
</body></html>
