<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../colors_and_type.css"/><style>body{padding:24px;background:white;}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}.sw{border-radius:10px;padding:12px;height:80px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--rh-border);}.sw .name{font-size:11px;font-weight:700;}.sw .hex{font-family:var(--rh-font-mono);font-size:10px;opacity:0.8;}</style></head><body>
<div class="row">
  <div class="sw" style="background:#FFFFFF;color:#0F1B2D;"><div class="name">White</div><div class="hex">#FFFFFF</div></div>
  <div class="sw" style="background:#F7F9FC;color:#0F1B2D;"><div class="name">Page bg</div><div class="hex">#F7F9FC</div></div>
  <div class="sw" style="background:#EEF2F7;color:#0F1B2D;"><div class="name">Alt bg</div><div class="hex">#EEF2F7</div></div>
  <div class="sw" style="background:#E2E8F0;color:#0F1B2D;"><div class="name">Border</div><div class="hex">#E2E8F0</div></div>
  <div class="sw" style="background:#94A3B8;color:white;border-color:transparent;"><div class="name">FG-3</div><div class="hex">#94A3B8</div></div>
  <div class="sw" style="background:#475569;color:white;border-color:transparent;"><div class="name">FG-2</div><div class="hex">#475569</div></div>
</div>
</body></html>
