<!DOCTYPE html><html><head><meta charset="UTF-8"/><link rel="stylesheet" href="../colors_and_type.css"/><style>body{padding:24px;background:#F7F9FC;}
.spec{background:white;border:1px solid var(--rh-border);border-radius:16px;padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#185FA5,#0A3A66);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;}
.av .v{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:#1D9E75;color:white;display:flex;align-items:center;justify-content:center;border:2px solid white;font-size:10px;}
.name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
.role{font-size:13px;color:var(--rh-fg-2);}
.lic{font-family:var(--rh-font-mono);font-size:10px;color:var(--rh-fg-3);margin-top:2px;}
.price{font-size:18px;font-weight:700;color:var(--rh-navy);}
</style></head><body>
<div class="spec">
  <div class="av">АК<span class="v">✓</span></div>
  <div>
    <div class="name">Anna Kowalski <span class="rh-badge rh-badge-verified">Verified</span></div>
    <div class="role">Immigration lawyer · Berlin</div>
    <div class="lic">License BRAK-DE-2019-44827</div>
  </div>
  <div style="text-align:right;">
    <div class="price">€150</div>
    <div style="font-size:12px;color:#F59E0B;font-weight:700;margin-top:2px;">★ 4.9</div>
  </div>
</div>
</body></html>
